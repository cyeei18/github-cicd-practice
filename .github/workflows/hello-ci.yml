name: Hello World CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    steps:
      - name: 打印问候语
        run: echo "Hello World!"
      - name: 显示日期
        run: date
      - name: 列出目录内容
        run: ls -l
      - name: 显示运行环境信息
        run: |
          echo "runner os : $RUNNER_OS"
          echo "commit sha: $GITHUB_SHA"
          echo "actor     : $GITHUB_ACTOR"
