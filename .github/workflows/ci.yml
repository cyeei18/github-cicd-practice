name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend · lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (tsc --noEmit)
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build (tsc)
        run: npm run build
      - name: Verify build output
        run: test -f dist/server.js && echo "✅ dist/server.js 已生成"

  frontend:
    name: frontend · lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (tsc --noEmit)
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build (vite)
        run: npm run build
      - name: Verify build output
        run: test -f dist/index.html && echo "✅ apps/frontend/dist/index.html 已生成"
